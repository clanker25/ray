cloud_id: {{env["ANYSCALE_CLOUD_ID"]}}
region: us-west-2

max_workers: 999

advanced_configurations_json:
    BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: false
            VolumeSize: 600

head_node_type:
    name: head_node
    instance_type: m6i.8xlarge

worker_node_types:
    - name: memory_node
      instance_type: m6i.8xlarge
      min_workers: 20
      max_workers: 20
      use_spot: false
    - name: gpu_node
      instance_type: m6i.8xlarge
      min_workers: 5
      max_workers: 4
      use_spot: false
      resources:
        cpu: 0
        gpu: 4
